<!doctype html>
<html lang="zh-CN">
<head>
    <!-- 在你的 index.html 里加入这行 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>贪吃蛇</title>
  <style>
    html,body{height:100%;margin:0}
    body{
      background:#071017; /* 深色背景 */
      display:flex;
      align-items:center;
      justify-content:center;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,"PingFang SC", "Microsoft Yahei", sans-serif;
      color:#cbd5e1;
    }
    .game-wrap{display:flex;flex-direction:column;align-items:center;gap:12px}
    canvas{background:#081018;border:4px solid #ffffff;border-radius:8px;display:block}
    .hud{display:flex;gap:12px;align-items:center}
    .score{color:#9be553;font-weight:700}
    .hint{font-size:13px;color:#94a3b8}
    .overlay{
      position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
      background:rgba(2,6,23,0.85);color:#e6eef8;padding:20px;border-radius:8px;text-align:center;
      box-shadow:0 6px 30px rgba(0,0,0,0.6);
    }
    .btn{margin-top:10px;padding:8px 12px;border-radius:6px;background:#0ea5a1;color:#032;cursor:pointer;border:none}
  </style>
</head>
<body>
  <div class="game-wrap">
    <div class="hud">
      <div class="score">得分: <span id="score">0</span></div>
      <div class="score">最高分: <span id="highScore">0</span></div>
      <div class="hint">用方向键控制。按 Enter 重新开始。</div>
    </div>
    <div style="position:relative">
      <canvas id="game" width="600" height="400"></canvas>
      <div id="overlay" class="overlay" style="display:none;">
        <div id="msg">游戏结束</div>
        <input id="username" type="text" placeholder="输入你的名字" style="margin-top:8px;padding:8px 10px;border-radius:6px;border:1px solid rgba(255,255,255,0.08);width:220px;color:inherit;background:transparent;">
        <div style="display:flex;gap:8px;margin-top:10px;justify-content:center;">
          <button id="uploadBtn" class="btn">上传分数</button>
          <button id="restart" class="btn">重新开始 (Enter)</button>
        </div>
        <div id="uploadStatus" class="hint" style="margin-top:8px"></div>
      </div>
    </div>
  </div>

  <script>
    // --- Supabase 连接配置开始 ---
    // 1. 初始化客户端
    const { createClient } = supabase;

    // ⚠️ 把下面两行引号里的内容，换成你刚才复制的 URL 和 Key
    const supabaseUrl = 'https://smloarjbpsztnpxunrcu.supabase.co';
    const supabaseKey = 'sb_publishable_F9O_O-uHImahLNAu5XZeFQ_K-WeHZv1';

    const _supabase = createClient(supabaseUrl, supabaseKey);

    // 2. 定义一个上传分数的函数（给游戏结束时调用）
    async function uploadScore(username, score) {
      const payload = { score: score, created_at: new Date() };
      if (username) payload.username = username;
      const { data, error } = await _supabase
        .from('leaderboard')
        .insert([payload]);

      if (error) {
        console.error('上传失败:', error);
        return { error };
      } else {
        console.log('分数上传成功！');
        return { data };
      }
    }
    // --- Supabase 连接配置结束 ---

    // 下面是你原来的游戏代码...

    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const highScoreEl = document.getElementById('highScore');
    const overlay = document.getElementById('overlay');
    const msg = document.getElementById('msg');
    const restartBtn = document.getElementById('restart');
    const usernameInput = document.getElementById('username');
    const uploadBtn = document.getElementById('uploadBtn');
    const uploadStatus = document.getElementById('uploadStatus');

    const scale = 20; // 每格像素大小
    const cols = Math.floor(canvas.width / scale);
    const rows = Math.floor(canvas.height / scale);

    let snake; // 数组 of {x,y}
    let dir; // {x,y}
    let food;
    let running = false;
    let score = 0;
    let highScore = 0;
    let timer = null;
    const speed = 640; // 毫秒（再慢一半，移动速度为之前的一半）

    function init(){
      snake = [];
      const startLen = 5;
      const startX = Math.floor(cols/2);
      const startY = Math.floor(rows/2);
      for(let i=0;i<startLen;i++){
        snake.push({x:startX - i, y:startY});
      }
      dir = {x:1,y:0};
      score = 0;
      spawnFood();
      // 读取本地最高分
      const hs = parseInt(localStorage.getItem('snakeHighScore'), 10);
      highScore = Number.isNaN(hs) ? 0 : hs;
      scoreEl.textContent = score;
      highScoreEl.textContent = highScore;
      running = true;
      overlay.style.display = 'none';
      if(timer) clearInterval(timer);
      timer = setInterval(loop, speed);
      draw();
    }

    function spawnFood(){
      while(true){
        const fx = Math.floor(Math.random()*cols);
        const fy = Math.floor(Math.random()*rows);
        if(!snake.some(s=>s.x===fx && s.y===fy)){
          food = {x:fx,y:fy};
          return;
        }
      }
    }

    function loop(){
      update();
      draw();
    }

    function update(){
      if(!running) return;
      const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
      // 撞墙检测
      if(head.x < 0 || head.x >= cols || head.y < 0 || head.y >= rows){
        gameOver();
        return;
      }
      // 撞自己
      if(snake.some(s => s.x===head.x && s.y===head.y)){
        gameOver();
        return;
      }
      snake.unshift(head);
      // 吃到食物
      if(head.x === food.x && head.y === food.y){
        score += 1;
        scoreEl.textContent = score;
        // 更新并保存最高分
        if(score > highScore){
          highScore = score;
          localStorage.setItem('snakeHighScore', String(highScore));
          highScoreEl.textContent = highScore;
        }
        spawnFood();
      } else {
        snake.pop();
      }
    }

    function draw(){
      // 背景
      ctx.fillStyle = '#071017';
      ctx.fillRect(0,0,canvas.width,canvas.height);

      // 淡淡的网格线（科技感背景）
      ctx.strokeStyle = 'rgba(255,255,255,0.04)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      for(let x=0;x<=cols;x++){
        const px = x * scale + 0.5;
        ctx.moveTo(px, 0);
        ctx.lineTo(px, canvas.height);
      }
      for(let y=0;y<=rows;y++){
        const py = y * scale + 0.5;
        ctx.moveTo(0, py);
        ctx.lineTo(canvas.width, py);
      }
      ctx.stroke();

      // 画食物
      ctx.fillStyle = '#ff4d6d';
      ctx.fillRect(food.x*scale + 2, food.y*scale + 2, scale-4, scale-4);

      // 画蛇
      for(let i=0;i<snake.length;i++){
        const s = snake[i];
        // 头用亮绿，身体用深绿
        ctx.fillStyle = i===0 ? '#8aff6b' : '#37b24d';
        ctx.fillRect(s.x*scale + 1, s.y*scale + 1, scale-2, scale-2);
        // 轮廓
        ctx.strokeStyle = 'rgba(0,0,0,0.2)';
        ctx.strokeRect(s.x*scale + 1, s.y*scale + 1, scale-2, scale-2);
      }
    }

    function gameOver(){
      running = false;
      clearInterval(timer);
      msg.textContent = `游戏结束，得分 ${score}。最高分 ${highScore}`;
      // 显示上传 UI，等待用户输入名字并手动上传
      if(usernameInput) usernameInput.value = '';
      if(uploadStatus) uploadStatus.textContent = '';
      if(uploadBtn){ uploadBtn.style.display = 'inline-block'; uploadBtn.disabled = false; }
      overlay.style.display = 'block';
    }

    // 键盘控制
    window.addEventListener('keydown', (e) =>{
      const key = e.key;
      if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(key)) e.preventDefault();
      if(key === 'ArrowUp' && dir.y !== 1){ dir = {x:0,y:-1}; }
      else if(key === 'ArrowDown' && dir.y !== -1){ dir = {x:0,y:1}; }
      else if(key === 'ArrowLeft' && dir.x !== 1){ dir = {x:-1,y:0}; }
      else if(key === 'ArrowRight' && dir.x !== -1){ dir = {x:1,y:0}; }
      else if(key === 'Enter'){
        init();
      }
    });

    restartBtn.addEventListener('click', ()=> init());

    // 上传分数按钮逻辑：验证名字并通过 Supabase 上传
    if(uploadBtn){
      uploadBtn.addEventListener('click', async () => {
        const name = usernameInput ? usernameInput.value.trim() : '';
        if(!name){
          if(uploadStatus) uploadStatus.textContent = '请输入名字后再上传。';
          return;
        }
        uploadBtn.disabled = true;
        if(uploadStatus) uploadStatus.textContent = '上传中...';
        try{
          const res = await uploadScore(name, score);
          if(res && res.error){
            if(uploadStatus) uploadStatus.textContent = '上传失败，请重试。';
            uploadBtn.disabled = false;
          } else {
            if(uploadStatus) uploadStatus.textContent = '上传成功';
            uploadBtn.style.display = 'none';
          }
        }catch(err){
          console.error(err);
          if(uploadStatus) uploadStatus.textContent = '上传出错';
          uploadBtn.disabled = false;
        }
      });
    }

    // 初始启动
    init();
  </script>
</body>
</html>
